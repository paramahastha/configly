name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build & release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # zig cc is used as a drop-in CGO cross-compiler for all targets.
      # It handles Linux (musl static), macOS (SDK bundled), and Windows (MinGW).
      # Installed under $HOME so the runner can write zig's cache without sudo.
      - name: Install zig
        run: |
          ZIG_VERSION=0.13.0
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /tmp
          mv "/tmp/zig-linux-x86_64-${ZIG_VERSION}" "$HOME/.zig"
          sudo ln -sf "$HOME/.zig/zig" /usr/local/bin/zig
          zig version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIG_GLOBAL_CACHE_DIR: /tmp/zig-cache

  build-darwin:
    name: Build macOS binaries
    runs-on: macos-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build and upload darwin binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist

          # darwin/amd64
          cd server
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 CC="clang -arch x86_64" \
            go build -ldflags="-s -w" -o ../dist/configly ./cmd/configly
          cd ..
          STAGE=$(mktemp -d)
          cp dist/configly LICENSE README.md CHANGELOG.md "$STAGE/"
          tar czf dist/configly-darwin-amd64.tar.gz -C "$STAGE" .
          rm -rf "$STAGE"

          # darwin/arm64
          cd server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 CC="clang -arch arm64" \
            go build -ldflags="-s -w" -o ../dist/configly ./cmd/configly
          cd ..
          STAGE=$(mktemp -d)
          cp dist/configly LICENSE README.md CHANGELOG.md "$STAGE/"
          tar czf dist/configly-darwin-arm64.tar.gz -C "$STAGE" .
          rm -rf "$STAGE"

          rm dist/configly

          # checksums for darwin archives
          cd dist
          shasum -a 256 configly-darwin-*.tar.gz > checksums-darwin.txt

          # upload to the release created by the goreleaser job
          gh release upload ${{ github.ref_name }} \
            configly-darwin-amd64.tar.gz \
            configly-darwin-arm64.tar.gz \
            checksums-darwin.txt

  publish-npm:
    name: Publish @configly/sdk to npm
    runs-on: ubuntu-latest
    needs: [goreleaser, build-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: cd sdk/js && npm install

      - name: Build
        run: cd sdk/js && npm run build

      - name: Typecheck
        run: cd sdk/js && npx tsc --noEmit

      - name: Test
        run: cd sdk/js && npm test

      # Strip the leading 'v' from the tag to get the semver version,
      # then set it in package.json before publishing.
      - name: Set package version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cd sdk/js
          npm version "$VERSION" --no-git-tag-version

      - name: Publish
        run: cd sdk/js && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/paramahastha/configly
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
